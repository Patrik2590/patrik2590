<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora  Científica</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="calculadora">
    <div class="pantalla">
      <input type="text" id="pantalla" readonly />
    </div>

    <div class="botones">
      <!-- Botones de control -->
      <button onclick="limpiar()">C</button>
      <button onclick="borrar()">←</button>
      <button onclick="agregar('(')">(</button>
      <button onclick="agregar(')')">)</button>

      <!-- Números y operaciones -->
      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button onclick="agregar('/')">÷</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button onclick="agregar('*')">×</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button onclick="agregar('-')">−</button>

      <button onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
      <button onclick="calcular()">=</button>
      <button onclick="agregar('+')">+</button>

      <!-- Funciones científicas -->
      <button onclick="funcion('Math.sin')">sin</button>
      <button onclick="funcion('Math.cos')">cos</button>
      <button onclick="funcion('Math.tan')">tan</button>
      <button onclick="funcion('Math.sqrt')">√</button>

      <button onclick="funcion('Math.log')">log</button>
      <button onclick="funcion('Math.exp')">exp</button>
      <button onclick="agregar('**')">xʸ</button>
      <button onclick="funcion('Math.PI')">π</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
